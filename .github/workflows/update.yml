name: bing壁纸每日更新

on:
  schedule:
    - cron: '10 19 * * *'   # UTC 12:10 ≈ 北京时间 3:10（凌晨，延迟后正好早上）
    - cron: '0 1 * * *'   # UTC 1:00 = 北京时间 9:00
    - cron: '0 9 * * *'   # UTC 9:00 = 北京时间 17:00
    
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 抓取壁纸
        run: npm run fetch

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add picture/ webp/ data/ urls.txt copyrights.txt
          git diff --staged --quiet || git commit -m "🖼️ 自动更新壁纸 $(date +'%Y-%m-%d')"
          git push
